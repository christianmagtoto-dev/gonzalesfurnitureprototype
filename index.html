<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gonzales Furniture · ERP prototype</title>
<meta name="description" content="Interactive prototype of the proposed Gonzales Furniture ERP. Fictional sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Gonzales Furniture — prototype UI
   Palette: pine (structure, primary actions), narra (brand mark only), cool paper surfaces,
   muted status colours. One typeface: IBM Plex Sans with tabular figures. */
:root {
  --pine-900: #17302B;
  --pine-800: #1E3B35;
  --pine-700: #24493F;
  --pine-600: #2D5A4E;
  --pine-100: #E3ECE8;
  --narra: #7B3F24;
  --paper: #F3F5F4;
  --surface: #FFFFFF;
  --ink: #1C2321;
  --ink-2: #4E5955;
  --ink-3: #75807B;
  --line: #DCE1DE;
  --line-2: #EBEEEC;
  --good: #2F6B45; --good-bg: #E5F1E9;
  --warn: #8A5A12; --warn-bg: #FBF0DB;
  --bad: #A3271F;  --bad-bg: #FBE7E5;
  --info: #2B5480; --info-bg: #E6EEF7;
  --neutral-bg: #EEF0EF;
  --img-bg: #E9E4DD; --img-wood: #9A5A36; --img-ink: #3B3B3B;
  --radius: 6px;
  --radius-sm: 4px;
  --font: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--paper);
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: var(--pine-600); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.005em; }
h1 { font-size: 22px; line-height: 1.25; }
h2 { font-size: 15px; line-height: 1.3; }
h3 { font-size: 14px; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--pine-600); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.num { text-align: right; white-space: nowrap; }
.strong { font-weight: 600; }
.mono-id { font-weight: 500; color: var(--ink-2); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ------------------------------------------------ buttons */
.btn { font: inherit; font-weight: 500; border-radius: var(--radius-sm); border: 1px solid transparent; padding: 8px 14px; cursor: pointer;
  min-height: 36px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn-sm { padding: 5px 10px; min-height: 30px; font-size: 13px; }
.btn-primary { background: var(--pine-700); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--pine-800); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover:not(:disabled) { border-color: var(--ink-3); }
.btn-danger { background: var(--surface); color: var(--bad); border-color: #E3B6B2; }
.btn-danger:hover:not(:disabled) { background: var(--bad-bg); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.action-wrap { display: inline-flex; flex-direction: column; gap: 4px; max-width: 100%; }
.action-reason { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: baseline; }
.action-reason::before { content: ''; width: 8px; height: 8px; border-radius: 2px; background: var(--bad); flex: none; transform: translateY(-1px); }
.icon-btn { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; cursor: pointer; color: inherit; padding: 6px 8px; border-radius: var(--radius-sm); }
.link-btn { font: inherit; background: none; border: 0; padding: 0; color: var(--pine-600); cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; }
.link-btn.light { color: #C9DAD3; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }

/* ------------------------------------------------ tags and pills */
.pill { display: inline-block; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.6; }
.pill-good { background: var(--good-bg); color: var(--good); }
.pill-warn { background: var(--warn-bg); color: var(--warn); }
.pill-bad { background: var(--bad-bg); color: var(--bad); }
.pill-info { background: var(--info-bg); color: var(--info); }
.pill-neutral { background: var(--neutral-bg); color: var(--ink-2); }
.tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: var(--radius-sm); border: 1px dashed; white-space: nowrap; line-height: 1.7; vertical-align: middle; }
.tag-sample { color: var(--ink-2); border-color: #B9C1BD; }
.tag-proposed { color: var(--info); border-color: #9DB5CF; }
.tag-validate { color: var(--warn); border-color: #D9B57A; }
.proto-badge { font-size: 12px; font-weight: 500; color: var(--narra); border: 1px solid #DCC3B5; background: #FBF6F2; padding: 2px 8px; border-radius: var(--radius-sm); white-space: nowrap; }
.tone-good { color: var(--good); } .tone-warn { color: var(--warn); } .tone-bad { color: var(--bad); }

/* ------------------------------------------------ shell */
.shell { display: flex; min-height: 100vh; }
.sidebar { width: 232px; flex: none; background: var(--pine-900); color: #E4ECE8; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.sidebar-top { display: flex; align-items: center; justify-content: space-between; padding: 16px 14px 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.sidebar nav ul { list-style: none; margin: 0; padding: 10px 8px; }
.sidebar nav a { display: flex; align-items: center; justify-content: space-between; color: #CFDDD7; padding: 8px 10px; border-radius: var(--radius-sm); font-weight: 500; }
.sidebar nav a:hover { background: rgba(255,255,255,0.06); text-decoration: none; color: #fff; }
.sidebar nav a.is-active { background: var(--pine-700); color: #fff; box-shadow: inset 3px 0 0 #C79A7E; }
.nav-count { background: #C79A7E; color: var(--pine-900); font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 999px; }
.sidebar-foot { margin-top: auto; padding: 14px 16px 18px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 2px; }
.who { font-weight: 600; color: #fff; } .who-role { font-size: 12.5px; color: #A9BDB5; margin-bottom: 8px; }
.sidebar-close { display: none; color: #fff; }
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text strong { font-size: 14px; } .brand-text span { font-size: 12px; color: var(--ink-3); }
.brand-light .brand-text span { color: #A9BDB5; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 10px 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-clock { font-size: 13px; color: var(--ink-2); }
.topbar-spacer { flex: 1; }
.menu-btn { display: none; }
.bell { position: relative; color: var(--ink-2); display: inline-flex; padding: 6px; border-radius: var(--radius-sm); }
.bell:hover { background: var(--paper); }
.bell-count { position: absolute; top: 0; right: -2px; background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 0 5px; line-height: 16px; }
.content { padding: 24px 28px 96px; max-width: 1320px; width: 100%; }
.scrim { display: none; }

/* ------------------------------------------------ page parts */
.page-head { margin-bottom: 20px; }
.page-head-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-sub { color: var(--ink-2); margin-top: 4px; max-width: 72ch; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 2px; }
.crumb-sep { margin: 0 6px; color: var(--line); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.panel-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.panel-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.panel-body { padding: 14px 16px 16px; }
.panel-body > .table-wrap { margin: -14px -16px -16px; width: auto; }
.nowrap { white-space: nowrap; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-bottom: 16px; }
.stat { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--line-2); min-width: 0; color: inherit; }
.stat:last-child { border-right: 0; }
a.stat-link:hover { background: #FAFBFA; text-decoration: none; }
.stat-label { font-size: 12.5px; color: var(--ink-2); }
.stat-value { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.stat-note { font-size: 12px; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 6px 16px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.empty { color: var(--ink-3); padding: 6px 0; }
.note { font-size: 12.5px; color: var(--ink-2); background: var(--paper); border-left: 3px solid var(--line); padding: 8px 10px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.note-warn { border-left-color: #D9B57A; background: #FDF8EE; }
.note-bad { border-left-color: var(--bad); background: #FDF3F2; }
.lock { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid #E3B6B2; background: #FDF3F2; border-radius: var(--radius-sm); }
.lock strong { color: var(--bad); }
.section-gap { margin-top: 16px; }

/* ------------------------------------------------ tables */
.table-wrap { width: 100%; overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--ink-3); padding: 9px 12px; border-bottom: 1px solid var(--line); background: #FAFBFA; white-space: nowrap; }
.table td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.table tr:last-child td { border-bottom: 0; }
.table-compact td { padding: 7px 12px; }
.row-link { cursor: pointer; }
.row-link:hover td { background: #F7F9F8; }
.row-hero td { background: #FBF7F4; }
.row-hero td:first-child { box-shadow: inset 3px 0 0 var(--narra); }

/* ------------------------------------------------ progress */
.progress { height: 6px; background: var(--line-2); border-radius: 999px; overflow: hidden; min-width: 60px; }
.progress-fill { height: 100%; border-radius: 999px; }
.fill-brand { background: var(--pine-600); } .fill-good { background: var(--good); } .fill-bad { background: var(--bad); } .fill-warn { background: #C08A2B; }
.progress-row { display: flex; align-items: center; gap: 10px; }
.progress-row .progress { flex: 1; }

/* ------------------------------------------------ the order thread */
.thread { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); counter-reset: t; }
.thread-step { position: relative; padding: 0 8px 0 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.thread-step::before { content: ''; position: absolute; top: 13px; left: 28px; right: 0; height: 2px; background: var(--line); }
.thread-step:last-child::before { display: none; }
.thread-step.is-done::before { background: var(--pine-600); }
.thread-dot { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600;
  background: var(--surface); border: 2px solid var(--line); color: var(--ink-3); }
.is-done .thread-dot { background: var(--pine-600); border-color: var(--pine-600); color: #fff; }
.is-current .thread-dot { border-color: var(--pine-600); color: var(--pine-700); box-shadow: 0 0 0 4px var(--pine-100); }
.is-blocked .thread-dot { border-color: var(--bad); background: var(--bad); color: #fff; }
.thread-label { font-weight: 600; font-size: 13.5px; margin-top: 6px; }
.thread-note { font-size: 12px; color: var(--ink-3); overflow-wrap: anywhere; padding-right: 6px; }
.is-blocked .thread-note { color: var(--bad); }
.thread-compact .thread-label { font-size: 12px; margin-top: 4px; }
.thread-compact .thread-dot { width: 22px; height: 22px; font-size: 11px; }
.thread-compact .thread-step::before { top: 10px; left: 22px; }

/* ------------------------------------------------ project hub */
.hub-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
.hub-title { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 18px; }
.hub-title h1 { font-size: 24px; }
.hub-meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--ink-2); margin-top: 4px; font-size: 13.5px; }
.hub-facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line-2); margin: 18px -20px -18px; }
.hub-facts > div { padding: 12px 20px; border-right: 1px solid var(--line-2); min-width: 0; }
.hub-facts > div:last-child { border-right: 0; }
.hub-facts span { display: block; font-size: 12.5px; color: var(--ink-3); }
.hub-facts strong { font-size: 16px; overflow-wrap: anywhere; }

/* ------------------------------------------------ activity */
.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.activity li:last-child { border-bottom: 0; }
.activity-when { font-size: 12.5px; color: var(--ink-3); grid-row: span 3; }
.activity-who { font-weight: 600; font-size: 13px; }
.activity-what { font-size: 13.5px; }
.activity-rec { font-size: 12px; color: var(--ink-3); }

/* ------------------------------------------------ misc lists */
.list { list-style: none; margin: 0; padding: 0; }
.list > li { padding: 10px 0; border-bottom: 1px solid var(--line-2); display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.list > li:last-child { border-bottom: 0; }
.list-main { min-width: 0; flex: 1 1 220px; }
.list-title { font-weight: 600; }
.list-sub { font-size: 12.5px; color: var(--ink-2); }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--info); display: inline-block; margin-right: 6px; transform: translateY(-1px); }
.notif-type-alert .notif-dot { background: var(--bad); } .notif-type-approval .notif-dot { background: #C08A2B; } .notif-type-success .notif-dot { background: var(--good); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; overflow-x: auto; }
.tabs button { font: inherit; background: none; border: 0; padding: 8px 12px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button[aria-selected='true'] { color: var(--ink); border-bottom-color: var(--pine-600); }
.checklist { list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.seg button { font: inherit; font-size: 13px; padding: 4px 12px; background: var(--surface); border: 0; cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed='true'].seg-pass { background: var(--good-bg); color: var(--good); font-weight: 600; }
.seg button[aria-pressed='true'].seg-fail { background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.sample-img { margin: 0; width: 180px; max-width: 100%; }
.sample-img svg { width: 100%; height: auto; display: block; border-radius: var(--radius-sm); border: 1px solid var(--line); }
.sample-img figcaption { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.board-col { background: #EDF0EE; border-radius: var(--radius); padding: 10px; min-width: 0; }
.board-col h3 { font-size: 13px; display: flex; justify-content: space-between; margin: 2px 2px 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
.card:last-child { margin-bottom: 0; }
.card-hero { border-color: #D9BFAF; box-shadow: inset 3px 0 0 var(--narra); }
.card-title { font-weight: 600; }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.form-row label { font-size: 12.5px; color: var(--ink-2); }
.input, select.input { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); min-height: 36px; width: 100%; }
.totals { margin-left: auto; width: min(320px, 100%); }
.totals div { display: flex; justify-content: space-between; padding: 4px 0; }
.totals .grand { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 8px; font-weight: 600; font-size: 16px; }

/* ------------------------------------------------ modal, toasts, demo */
.modal-backdrop { position: fixed; inset: 0; background: rgba(23, 48, 43, 0.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: var(--radius); width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; outline: none; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line-2); }
.modal-body { padding: 16px; }
.modal-foot { padding: 12px 16px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(480px, calc(100vw - 32px)); }
.toast { background: var(--pine-900); color: #fff; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13.5px; }
.toast-error { background: var(--bad); }
.demo { position: fixed; right: 16px; bottom: 16px; z-index: 40; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.demo-toggle { font: inherit; font-size: 13px; font-weight: 600; background: var(--narra); color: #fff; border: 0; border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; }
.demo-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); width: min(380px, calc(100vw - 32px)); max-height: min(70vh, 620px); overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 24px rgba(23,48,43,0.18); }
.demo-next { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; padding-bottom: 12px; border-bottom: 1px solid var(--line-2); }
.demo-steps ol { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }

/* ------------------------------------------------ login */
.login { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.login-side { background: var(--pine-900); color: #E4ECE8; padding: 40px; display: flex; flex-direction: column; gap: 28px; }
.login-side h1 { font-size: 30px; line-height: 1.2; color: #fff; max-width: 18ch; font-weight: 600; }
.login-side p { color: #BCD0C8; max-width: 44ch; }
.login-side .thread-wrap { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: var(--radius); padding: 16px; }
.login-side .thread-label { color: #fff; } .login-side .thread-note { color: #A9BDB5; }
.login-main { padding: 40px; display: flex; flex-direction: column; gap: 20px; max-width: 760px; }
.role-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.role-card { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; display: grid; grid-template-columns: 40px 1fr; gap: 2px 12px; align-items: start; }
.role-card:hover { border-color: var(--pine-600); }
.role-card .avatar { grid-row: span 3; }
.role-card .r-name { font-weight: 600; } .role-card .r-person { font-size: 13px; color: var(--ink-2); } .role-card .r-blurb { font-size: 12.5px; color: var(--ink-3); }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--pine-100); color: var(--pine-700); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
.fake-login { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.fake-login .form-row { margin: 0; flex: 1 1 200px; }

/* ------------------------------------------------ phone apps */
.phone-stage { min-height: 100vh; display: flex; justify-content: center; gap: 32px; padding: 32px 16px 96px; background: #E7EBE9; }
.phone-aside { width: 220px; display: flex; flex-direction: column; gap: 12px; padding-top: 12px; }
.phone { width: 390px; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-height: 760px; box-shadow: 0 12px 32px rgba(23,48,43,0.15); }
.phone-top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.phone-top .brand-text { display: none; }
.phone-title { display: block; font-weight: 600; font-size: 17px; } .phone-sub { display: block; font-size: 12.5px; color: var(--ink-3); }
.phone-body { padding: 14px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.m-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.m-card h2 { font-size: 16px; }
.m-big { font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.m-btn { font: inherit; font-size: 16px; font-weight: 600; min-height: 52px; border-radius: 10px; border: 1px solid transparent; width: 100%; cursor: pointer; padding: 10px 14px; }
.m-btn-primary { background: var(--pine-700); color: #fff; }
.m-btn-secondary { background: var(--surface); border-color: var(--line); color: var(--ink); }
.m-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.m-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.m-task { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.m-task.is-next { border-color: var(--pine-600); box-shadow: inset 4px 0 0 var(--pine-600); }
.m-label { font-size: 12.5px; color: var(--ink-3); }
.m-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); position: sticky; bottom: 0; }
.m-tabs button { font: inherit; font-size: 13px; background: none; border: 0; padding: 12px 4px; min-height: 52px; color: var(--ink-3); cursor: pointer; font-weight: 500; }
.m-tabs button[aria-selected='true'] { color: var(--pine-700); box-shadow: inset 0 3px 0 var(--pine-600); }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { font: inherit; font-size: 22px; width: 52px; height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.estimate-label { font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); padding: 1px 8px; border-radius: 999px; }

.mobile-switch { display: none; }
.mobile-switch .form-row { margin: 0; }

/* ------------------------------------------------ no access */
.no-access { max-width: 520px; margin: 48px auto; text-align: left; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

/* ------------------------------------------------ responsive */
@media (max-width: 1100px) {
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-main { grid-template-columns: minmax(0, 1fr); }
  .hub-facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .login { grid-template-columns: 1fr; }
  .login-side { padding: 28px 24px; }
}
@media (max-width: 860px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; transform: translateX(-100%); transition: transform 160ms ease; height: 100%; }
  .sidebar.is-open { transform: none; }
  .sidebar-close { display: inline-block; }
  .scrim { display: block; position: fixed; inset: 0; background: rgba(23,48,43,0.4); z-index: 20; }
  .menu-btn { display: inline-block; }
  .topbar { padding: 8px 16px; }
  .content { padding: 16px 16px 96px; }
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .thread { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 14px; }
  .thread-step:nth-child(3)::before { display: none; }
  .phone-aside { display: none; }
  .mobile-switch { display: block; }
  .phone-stage { padding: 0; background: var(--paper); }
  .phone { border: 0; border-radius: 0; min-height: 100vh; box-shadow: none; width: 100%; }
  .phone-top .brand-text { display: none; }
}
@media (max-width: 640px) {
  h1 { font-size: 20px; } .hub-title h1 { font-size: 20px; }
  .topbar-clock { display: none; }
  .hub-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hub-facts > div { border-bottom: 1px solid var(--line-2); }
  .board { grid-template-columns: minmax(0, 1fr); }
  .role-grid { grid-template-columns: minmax(0, 1fr); }
  .login-main { padding: 24px 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { border-bottom: 1px solid var(--line-2); }
  .activity li { grid-template-columns: minmax(0, 1fr); }
  .activity-when { grid-row: auto; }
  /* tables become stacked cards */
  .table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
  .table tr { border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .table td { border: 0; padding: 3px 0; display: grid; justify-items: start; align-items: baseline; grid-template-columns: minmax(96px, 40%) minmax(0, 1fr); gap: 8px; text-align: left; }
  .table td::before { content: attr(data-label); color: var(--ink-3); font-size: 12.5px; }
  .table td.num { text-align: left; white-space: normal; }
  .row-hero td:first-child { box-shadow: none; }
  .row-hero { box-shadow: inset 3px 0 0 var(--narra); }
  .kv { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
  .kv dd { margin-bottom: 8px; }
}
